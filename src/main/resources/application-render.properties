# Render / PostgreSQL profile
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate

# The initial migration targets an empty PostgreSQL schema. Enable explicitly only
# after confirming the Render database is empty or has been safely baselined.
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.locations=classpath:db/migration/postgresql

logging.level.com.studentreadiness=INFO
logging.level.org.springframework.security=WARN
