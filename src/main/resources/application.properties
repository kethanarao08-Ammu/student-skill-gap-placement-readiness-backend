# Application Properties
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/api

# Active profile: local MySQL by default; Render can override with SPRING_PROFILES_ACTIVE=render
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# JPA & Hibernate defaults
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# JWT Security
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Allowed Origins
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}

# Logging
logging.level.com.studentreadiness=INFO
logging.level.org.springframework.security=WARN
